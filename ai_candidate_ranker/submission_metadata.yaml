ai_usage_summary: |
  Used Gemini for code generation, structuring the ranker pipeline, and implementing the honeypot detection heuristics. Used Claude for architectural reviews and refinement of the scoring weights. No candidate data was shared with external LLM services during ranking.

methodology_summary: |
  An optimized, rule-based ranking engine utilizing standard Python libraries. Incorporates a strict semantic filtering pass that eliminates 7,533 honeypots and timeline inconsistencies (e.g., career duration mismatch, signup date discrepancies). Scores candidates by experience alignment (ideal 5–9 YOE), location (Noida/Pune hybrid or willing to relocate in India), title keywords, and NLP/IR tech skills. Scores are scaled by a multiplicative behavioral signal envelope (recurrent activity, response rate, low notice period, and high interview reliability). Runs in under 5 seconds for 100k candidates.

